services:
  db:
    image: docker.1ms.run/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiheng_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8088:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zhiheng_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/zhiheng_copilot}
      APP_NAME: ${APP_NAME:-Zhiheng Copilot API}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_DATA_DIR: ${API_DATA_DIR:-/data}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-dev-only}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-dev-only}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-60}
      KIMI_INPUT_PRICE_PER_MTOK: ${KIMI_INPUT_PRICE_PER_MTOK:-0}
      KIMI_OUTPUT_PRICE_PER_MTOK: ${KIMI_OUTPUT_PRICE_PER_MTOK:-0}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8086:8000"
    volumes:
      - ./server:/app
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  api_data:
  pg_data:
