services:
  db:
    image: docker.1ms.run/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiheng_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8088:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zhiheng_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/zhiheng_copilot}
      APP_NAME: ${APP_NAME:-Zhiheng Copilot API}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_DATA_DIR: ${API_DATA_DIR:-/data}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8086:8000"
    volumes:
      - ./server:/app
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  api_data:
  pg_data:
