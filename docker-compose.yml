services:
  db:
    image: docker.1ms.run/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiheng_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 仅绑定回环地址：供本机开发工具访问，公网不可达
      - "127.0.0.1:8088:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zhiheng_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/zhiheng_copilot}
      APP_NAME: ${APP_NAME:-Zhiheng Copilot API}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_DATA_DIR: ${API_DATA_DIR:-/data}
      MAX_UPLOAD_FILE_SIZE_BYTES: ${MAX_UPLOAD_FILE_SIZE_BYTES:-104857600}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-dev-only}
      # 默认创建 demo 演示账号；生产环境在 .env 中显式设置 SEED_DEMO_PASSWORD=（空值）即可跳过创建
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD-demo-dev-only}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-120}
      KIMI_INPUT_PRICE_PER_MTOK: ${KIMI_INPUT_PRICE_PER_MTOK:-0}
      KIMI_OUTPUT_PRICE_PER_MTOK: ${KIMI_OUTPUT_PRICE_PER_MTOK:-0}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      # 仅绑定回环地址：供本机 vite proxy 与联调使用，公网仅经 web 反代访问
      - "127.0.0.1:8086:8000"
    volumes:
      - ./server:/app
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 镜像内无 curl，使用 python 探测健康端点
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./client
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  api_data:
  pg_data:
